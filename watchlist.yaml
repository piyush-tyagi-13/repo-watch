# Sources checked every Monday.
#
# Shared fields:
#   name   - section heading in the email
#   group  - optional heading the entry is filed under
#   focus  - optional topic steer; the summary keeps to this and says so
#            explicitly when nothing in the update touches it
#
# type: releases   requires  repo: owner/name
#   Every release published since the last seen tag is collected, so
#   high-cadence repos do not lose the middle of the week. Prereleases are
#   skipped unless include_prereleases: true - openai/codex cuts alpha builds
#   several times a day and they bury the stable changelog.
#
# type: docs       requires  url: <page>.md
#   The page is diffed against last week's snapshot in snapshots/.

PLUGIN_FOCUS: &plugin_focus >-
  how the harness itself works and how plugins are built for it: the plugin
  manifest format and loading behaviour, skills, hooks, subagents, slash
  commands, MCP servers and tooling, sandboxing and permissions, the plugin
  CLI, and marketplace *mechanics* such as schema, hosting and distribution.
  Any breaking change for plugin authors is the single most important thing
  to surface.

  Explicitly out of scope, never report these: news about individual
  third-party plugins, extensions or skills - which ones were added, updated
  or removed from any marketplace or bundled set, and what those particular
  plugins do. The reader builds their own plugins in a private enterprise
  marketplace and does not care what other people ship. Report the plumbing,
  never the catalogue. Also ignore unrelated model, billing and end-user UI
  changes.

watchlist:
  - name: Claude Code
    group: Claude
    type: releases
    repo: anthropics/claude-code
    focus: *plugin_focus

  - name: Claude Code - Plugins guide
    group: Claude
    type: docs
    url: https://docs.claude.com/en/docs/claude-code/plugins.md
    focus: *plugin_focus

  - name: Claude Code - Plugin marketplaces
    group: Claude
    type: docs
    url: https://docs.claude.com/en/docs/claude-code/plugin-marketplaces.md
    focus: *plugin_focus

  - name: Claude Code - Plugins reference
    group: Claude
    type: docs
    url: https://docs.claude.com/en/docs/claude-code/plugins-reference.md
    focus: *plugin_focus

  - name: Claude Code - Skills
    group: Claude
    type: docs
    url: https://docs.claude.com/en/docs/claude-code/skills.md
    focus: *plugin_focus

  - name: Codex
    group: Codex
    type: releases
    repo: openai/codex
    focus: *plugin_focus

  - name: Codex - Plugins
    group: Codex
    type: docs
    url: https://developers.openai.com/codex/plugins.md
    focus: *plugin_focus

  - name: Codex - Skills
    group: Codex
    type: docs
    url: https://developers.openai.com/codex/skills.md
    focus: *plugin_focus

  - name: Codex - MCP
    group: Codex
    type: docs
    url: https://developers.openai.com/codex/mcp.md
    focus: *plugin_focus

  - name: Spec Kit
    group: Other
    type: releases
    repo: github/spec-kit
    focus: >-
      the tool's own behaviour, commands, workflow and spec format. Do not
      report which bundled or community extensions were added or version
      bumped - the reader wants the tool, not its catalogue.
