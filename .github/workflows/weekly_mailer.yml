name: Weekly Repo Watch Mailer

# Fires daily; main.py's report gate is what actually keeps the mail weekly
# (Mondays - see REPORT_WEEKDAY in main.py). A once-a-week cron has no room
# to recover if GitHub's scheduler drops its one occurrence for the week -
# which happened here: this repo's very first Monday-only cron fired zero
# times, with no run record at all, while a sibling project's daily cron on
# this same account has never missed a day. Firing daily and gating in code
# is proven reliable; firing weekly and hoping is not.
on:
  schedule:
    - cron: '25 10 * * *'  # daily, 3:55 PM IST (10:25 UTC); off the :30 slot GitHub's scheduler is slowest on
    # Monday backups. If GitHub drops the 10:30 occurrence, the report still
    # goes out within the hour. The gate in main.py makes these idempotent:
    # once a report is recorded for the week, later triggers exit in seconds.
    - cron: '50 10 * * 1'
    - cron: '15 11 * * 1'
  workflow_dispatch:
    inputs:
      reset_mode:
        description: 'Where "since last time" starts'
        type: choice
        required: false
        default: none
        options:
          - none      # normal run, compare against recorded state
          - lookback  # replay the last N days, then make today canonical
          - baseline  # make today canonical without reporting anything
      lookback_days:
        description: 'Days to replay when reset_mode is lookback'
        type: string
        required: false
        default: '7'
      gated:
        description: 'Respect the weekly gate (the trigger workflow sets this; leave false for a manual run)'
        type: boolean
        required: false
        default: false

jobs:
  mailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Repo Watch Mailer
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESET_MODE: ${{ inputs.reset_mode || 'none' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          GATED: ${{ inputs.gated || 'false' }}
        run: |
          python main.py

      - name: Commit updated state and doc snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json snapshots/
          git commit -m "Update watch state [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
