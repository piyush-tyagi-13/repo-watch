name: Weekly Repo Watch Mailer

on:
  schedule:
    - cron: '30 3 * * 1'  # Monday 9:00 AM IST (3:30 UTC)
  workflow_dispatch:
    inputs:
      reset_mode:
        description: 'Where "since last time" starts'
        type: choice
        required: false
        default: none
        options:
          - none      # normal run, compare against recorded state
          - lookback  # replay the last N days, then make today canonical
          - baseline  # make today canonical without reporting anything
      lookback_days:
        description: 'Days to replay when reset_mode is lookback'
        type: string
        required: false
        default: '7'

jobs:
  mailer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Repo Watch Mailer
        env:
          GMAIL_SENDER_EMAIL: ${{ secrets.GMAIL_SENDER_EMAIL }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          GH_PAT: ${{ secrets.GH_PAT }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RESET_MODE: ${{ inputs.reset_mode || 'none' }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
        run: |
          python main.py

      - name: Commit updated state and doc snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json snapshots/
          git commit -m "Update watch state [skip ci]" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
